name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Cache:alice-cache" \
            "ALICE-Analytics:alice-analytics" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Crypto:alice-crypto"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --tests
      - run: cargo test --doc

  test-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Cache:alice-cache" \
            "ALICE-Analytics:alice-analytics" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Crypto:alice-crypto"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features content_types
      - run: cargo test --features sdf

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Cache:alice-cache" \
            "ALICE-Analytics:alice-analytics" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Crypto:alice-crypto"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib --tests -- -W clippy::all -D warnings
      - run: cargo clippy --features content_types --lib --tests -- -W clippy::all -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Cache:alice-cache" \
            "ALICE-Analytics:alice-analytics" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Crypto:alice-crypto"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
