name: CI

on:
  push:
    # ci/** runs the whole workflow on a branch before it is landed on main
    branches: [main, "ci/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --tests
      - run: cargo test --doc

  # the library without std (`default-features = false`, as ALICE-Manga takes it): a bare-metal target has no std,
  # so a std-only call (`f64::sqrt`, `vec!` without the alloc import) fails here instead of in a consumer
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # into the toolchain rust-toolchain.toml pins (the action's `targets:` would go to stable)
      - name: Add the bare-metal target
        run: rustup target add thumbv7em-none-eabihf
      - name: Build without std
        run: cargo build --locked --lib --no-default-features --target thumbv7em-none-eabihf

  test-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features content_types
      - run: cargo test --features sdf
      # the bridges to alice-analytics / alice-cache / libasp / alice-crypto (git, branch main;
      # the lock records the commit)
      - name: Test (ALICE bridges)
        run: cargo test --features analytics,cache,asp,crypto --lib --tests

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib --tests -- -W clippy::all -D warnings
      - run: cargo clippy --features content_types --lib --tests -- -W clippy::all -D warnings
      - name: Clippy (ALICE bridges)
        run: cargo clippy --features analytics,cache,asp,crypto --lib --tests -- -W clippy::all -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
